# Values for stage pfp-terminate.
# Declare variables to be passed into your templates.

replicaCount: 1

# image:
#   repository: nginx
#   pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

app:
  env: production
  inovisApiUrl: https://inovis.renomia.cz
  inovisClientSecret: oauth-inovis-credentials
  inovisOauthGrantType: client_credentials
  inovisOauthScope: public
  storageSecret: storage-credentials

  # ga4ConfigurationConfigMap: ga4-config-json

ingress:
  enabled: true
  # certManager: true
  # className: ""
  annotations: 
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
  hostname: terminate.suri.cz
  hosts:
    - host: terminate.suri.cz
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: terminate.srovnator.cz
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: terminate.povinne-ruceni.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: pfp-terminate-tls
     hosts:
       - terminate.suri.cz
       - terminate.srovnator.cz
       - terminate.povinne-ruceni.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
