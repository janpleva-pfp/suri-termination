# Values for stage pfp-terminate.
# Declare variables to be passed into your templates.

replicaCount: 1

# image:
#   repository: nginx
#   pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

app:
  env: stage
  inovisApiUrl: https://stage.inovis.renomia.cz
  inovisClientSecret: oauth-inovis-credentials
  inovisOauthGrantType: client_credentials
  inovisOauthScope: public
  storageSecret: storage-credentials

  # ga4ConfigurationConfigMap: ga4-config-json

ingress:
  enabled: true
  # certManager: true
  # className: ""
  annotations: 
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
  hostname: terminate.stage.suri.cz
  hosts:
    - host: terminate.stage.suri.cz
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: terminate.stage.srovnator.cz
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: terminate.stage.povinne-ruceni.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: pfp-terminate-tls
     hosts:
       - terminate.stage.suri.cz
       - terminate.stage.srovnator.cz
       - terminate.stage.povinne-ruceni.com

resources: 
  limits:
    cpu: 1000m
    memory: 1100Mi
  requests:
    cpu: 50m
    memory: 1100Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
